name: Outward DE - build and checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'outward-companheiros/**'
      - '.github/workflows/outward.yml'
  pull_request:
    paths:
      - 'outward-companheiros/**'
      - '.github/workflows/outward.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build DE plugin against pinned development references
        run: dotnet build outward-companheiros/src/Outward.Companheiros.csproj -c Release
      - name: Rules tests - every route and story-gate combination
        run: dotnet run --project outward-companheiros/tests/Tests.csproj -c Release
      - name: Production caravan adapter against controlled stand-ins
        run: dotnet run --project outward-companheiros/tests/Adapter/Adapter.csproj -c Release
      - name: Reward sharing - production callbacks and real HarmonyX detours
        shell: pwsh
        run: |
          dotnet run --project outward-companheiros/tests/Rewards/Rewards.csproj -c Release -f net8.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build outward-companheiros/tests/Rewards/Rewards.csproj -c Release -f net472
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & outward-companheiros/tests/Rewards/bin/Release/net472/Rewards.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check DE contracts, private access and embedded portraits
        shell: pwsh
        run: |
          $game = "$env:USERPROFILE/.nuget/packages/outward.gamelibs/2022.5.18-r.0/lib/net472/Assembly-CSharp.dll"
          dotnet run --project outward-companheiros/tools/Contracts/Contracts.csproj -c Release -- "$game" outward-companheiros/src/bin/Release/net472/Outward.Companheiros.dll
      - name: Exact published package - bundled Harmony and DE contract integration
        shell: pwsh
        run: |
          $game = "$env:USERPROFILE/.nuget/packages/outward.gamelibs/2022.5.18-r.0/lib/net472/Assembly-CSharp.dll"
          $unity = "$env:USERPROFILE/.nuget/packages/unityengine.modules/2020.3.26/lib/net35"
          $zip = "downloads/Outward-Companheiros-v0.3.0-Completo.zip"
          $fixtures = "$env:RUNNER_TEMP/outward-reward-fixtures"
          dotnet build outward-companheiros/tests/PackageSmoke/PackageSmoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & outward-companheiros/tests/PackageSmoke/bin/Release/net472/PackageSmoke.exe "$zip" "$game" "$unity"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project outward-companheiros/tools/RewardFixtures/RewardFixtures.csproj -c Release -- "$game" "$fixtures"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($case in @("enum-changed", "private-selector")) {
            & outward-companheiros/tests/PackageSmoke/bin/Release/net472/PackageSmoke.exe "$zip" "$fixtures/$case/Assembly-CSharp.dll" "$unity" reject
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Package plugin and beginner guide only
        run: python outward-companheiros/tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Outward-Companheiros-v0.3.0-Windows
          path: outward-companheiros/dist/*
          if-no-files-found: error
