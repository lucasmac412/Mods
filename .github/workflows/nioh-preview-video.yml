name: Record Nioh gloves standalone preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'nioh-luvas/tools/record_video.mjs'
      - '.github/workflows/nioh-preview-video.yml'
permissions:
  contents: read
jobs:
  record:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture actual browser preview and verify attack sequences
        run: node nioh-luvas/tools/record_video.mjs nioh-luvas/dist/video
      - uses: actions/upload-artifact@v4
        with:
          name: Nioh-gloves-preview-video
          path: nioh-luvas/dist/video/
          if-no-files-found: error
          retention-days: 30
