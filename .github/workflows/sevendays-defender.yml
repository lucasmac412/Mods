name: 7 Days - Microsoft Defender audit
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Optional repository path of a candidate ZIP to scan
        required: false
        default: ''
      candidate_base64:
        description: Candidate ZIP transported to the scanner only; never executed
        required: false
        default: ''
      candidate_sha256:
        description: Expected SHA256 of the candidate ZIP
        required: false
        default: ''
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore the reported sample for analysis only
        shell: python
        run: |
          import pathlib, subprocess, os, json, base64, hashlib, zipfile, io
          target = pathlib.Path('av-audit/reported')
          target.mkdir(parents=True)
          path = 'downloads/7Days-Crafting-dos-Baus-3.4-v0.2.0-Experimental.zip'
          with (target/'reported.zip').open('wb') as stream:
              subprocess.run(['git','show','588d47f:'+path], stdout=stream, check=True)
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          if inputs.get('candidate_base64'):
              data = base64.b64decode(inputs['candidate_base64'], validate=True)
              assert hashlib.sha256(data).hexdigest() == inputs['candidate_sha256'].lower()
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  assert len(archive.infolist()) <= 64
                  assert sum(f.file_size for f in archive.infolist()) < 8 * 1024 * 1024
                  for member in archive.namelist():
                      assert not member.startswith(('/', '\\')) and ':' not in member
                      assert '..' not in member.replace('\\', '/').split('/')
              pathlib.Path('av-audit/candidate.zip').write_bytes(data)
      - name: Scan without running the mod
        shell: pwsh
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force av-report | Out-Null
          Start-Transcript -Path av-report/defender.txt
          try {
            Get-Service WinDefend | Format-List Name,Status,StartType
            if ((Get-Service WinDefend).Status -ne 'Running') {
              Set-Service WinDefend -StartupType Automatic
              Start-Service WinDefend
            }
            # GitHub's Windows image excludes entire drives by default. Remove
            # exclusions only on this disposable analysis VM; never weaken AV.
            $before = Get-MpPreference
            $before | Select-Object ExclusionPath,ExclusionProcess,ExclusionExtension,DisableArchiveScanning,MAPSReporting,SubmitSamplesConsent | ConvertTo-Json -Depth 4 | Set-Content av-report/preferences-before.json
            if ($before.ExclusionPath) { Remove-MpPreference -ExclusionPath $before.ExclusionPath }
            if ($before.ExclusionProcess) { Remove-MpPreference -ExclusionProcess $before.ExclusionProcess }
            if ($before.ExclusionExtension) { Remove-MpPreference -ExclusionExtension $before.ExclusionExtension }
            Set-MpPreference -DisableArchiveScanning $false -MAPSReporting Advanced -SubmitSamplesConsent SendSafeSamples
            Update-MpSignature
            Get-MpComputerStatus | ConvertTo-Json -Depth 4 | Set-Content av-report/engine.json
            Get-MpPreference | Select-Object ExclusionPath,ExclusionProcess,ExclusionExtension,DisableArchiveScanning,MAPSReporting,SubmitSamplesConsent | ConvertTo-Json -Depth 4 | Set-Content av-report/preferences.json
            Get-MpComputerStatus | Select-Object AMServiceEnabled,AntivirusEnabled,AMProductVersion,AMEngineVersion,AntivirusSignatureVersion,AntivirusSignatureLastUpdated | Format-List
            $engine = (Get-MpComputerStatus)
            if (-not $engine.AMServiceEnabled -or -not $engine.AntivirusEnabled) { throw 'Defender is not active; this is NOT a clean result.' }
            $scanner = Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $scanner) { $scanner = Get-Item "$env:ProgramFiles/Windows Defender/MpCmdRun.exe" }
            $output = & $scanner.FullName -ValidateMapsConnection 2>&1
            $mapsExit = $LASTEXITCODE
            $output | Tee-Object -FilePath av-report/cloud.txt
            if ($mapsExit -ne 0) { throw "Cloud connection validation failed: $mapsExit" }
            $scanRoot = Join-Path $env:ProgramData ('ModSecurityAudit/' + $env:GITHUB_RUN_ID)
            New-Item -ItemType Directory -Force $scanRoot | Out-Null
            Copy-Item av-audit/reported/reported.zip $scanRoot
            $targets = @((Join-Path $scanRoot 'reported.zip'))
            if (Test-Path av-audit/candidate.zip) {
              Copy-Item av-audit/candidate.zip $scanRoot
              $targets += (Join-Path $scanRoot 'candidate.zip')
            }
            if ($env:CANDIDATE) {
              $root = (Get-Location).Path + [IO.Path]::DirectorySeparatorChar
              $path = [IO.Path]::GetFullPath((Join-Path $root $env:CANDIDATE))
              if (-not $path.StartsWith($root) -or -not (Test-Path -LiteralPath $path)) { throw 'Invalid candidate path' }
              Copy-Item -LiteralPath $path -Destination (Join-Path $scanRoot 'candidate.zip')
              $targets += (Join-Path $scanRoot 'candidate.zip')
            }
            $results = @()
            foreach ($target in $targets) {
              Set-Content -LiteralPath $target -Stream Zone.Identifier -Value "[ZoneTransfer]`nZoneId=3"
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash
              $output = & $scanner.FullName -CheckExclusion -Path $target 2>&1
              $checkCode = $LASTEXITCODE
              $output | Tee-Object -FilePath av-report/scanner.txt -Append
              if ($checkCode -ne 1) { throw "Could not verify that target is outside exclusions: $checkCode" }
              $output = & $scanner.FullName -Scan -ScanType 3 -File (Resolve-Path -LiteralPath $target).Path 2>&1
              $exit = $LASTEXITCODE
              $output | Tee-Object -FilePath av-report/scanner.txt -Append
              $results += [pscustomobject]@{path=$target;sha256=$hash;exitCode=$exit}
              if (Test-Path -LiteralPath $target) {
                $expanded = Join-Path $scanRoot ([IO.Path]::GetFileNameWithoutExtension($target))
                Expand-Archive -LiteralPath $target -DestinationPath $expanded -Force
                Get-ChildItem $expanded -File -Recurse | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
                $output = & $scanner.FullName -CheckExclusion -Path $expanded 2>&1
                $checkCode = $LASTEXITCODE
                $output | Tee-Object -FilePath av-report/scanner.txt -Append
                if ($checkCode -ne 1) { throw "Could not verify extracted directory exclusions: $checkCode" }
                $output = & $scanner.FullName -Scan -ScanType 3 -File (Resolve-Path $expanded).Path 2>&1
                $scanExit = $LASTEXITCODE
                $output | Tee-Object -FilePath av-report/scanner.txt -Append
                $results += [pscustomobject]@{path=$expanded;sha256='individual hashes in transcript';exitCode=$scanExit}
              }
            }
            $results | ConvertTo-Json | Set-Content av-report/results.json
            $detections = @(Get-MpThreatDetection | Select-Object ThreatID,ThreatStatusID,Resources,InitialDetectionTime,ActionSuccess)
            ConvertTo-Json -InputObject $detections -Depth 4 | Set-Content av-report/detections.json
            $threats = @(Get-MpThreat | Select-Object ThreatID,ThreatName,IsActive)
            ConvertTo-Json -InputObject $threats -Depth 4 | Set-Content av-report/threats.json
            if ($detections.Count -gt 0 -or $threats.Count -gt 0) { throw 'Defender recorded a detection; inspect the report even if remediation succeeded.' }
            if ($results.Where({$_.exitCode -ne 0}).Count -gt 0) { throw 'Scanner returned a detection or error; inspect the report.' }
          } finally {
            try {
              ConvertTo-Json -InputObject @(Get-MpThreatDetection | Select-Object ThreatID,ThreatStatusID,Resources,InitialDetectionTime,ActionSuccess) -Depth 4 | Set-Content av-report/detections-final.json
              ConvertTo-Json -InputObject @(Get-MpThreat | Select-Object ThreatID,ThreatName,IsActive) -Depth 4 | Set-Content av-report/threats-final.json
            } catch { Write-Warning $_ }
            Stop-Transcript
          }
      - name: Upload text evidence only, never samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defender-evidence
          path: av-report/
