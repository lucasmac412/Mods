plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
}
loom {
    splitEnvironmentSourceSets()
    mods {
        moonfist {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (project.hasProperty('compatDragon')) runtimeOnly files(project.property('compatDragon'))
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
test { useJUnitPlatform() }
tasks.withType(JavaExec).configureEach {
    ['http.proxyHost', 'http.proxyPort', 'http.nonProxyHosts', 'https.proxyHost',
     'https.proxyPort', 'javax.net.ssl.trustStore', 'javax.net.ssl.trustStorePassword'].each { key ->
        def value = System.getProperty(key)
        if (value != null) systemProperty key, value
    }
}
base { archivesName = 'moonfist-combat' }
jar { from('../LICENSE') }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'moonfist_gametest'
        enableGameTests = true
        enableClientGameTests = true
    }
}
tasks.named('runGameTest', JavaExec) {
    def report = layout.buildDirectory.file('test-results/gametest.xml')
    systemProperty 'fabric-api.gametest.report-file', report.get().asFile.absolutePath
    doFirst { report.get().asFile.parentFile.mkdirs() }
}
