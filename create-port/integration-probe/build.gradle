// Development tests of prerequisites. This project is NOT the Create mod.
plugins { id 'net.fabricmc.fabric-loom' version '1.18.4' }
version = '0.1.0-dev'
repositories { mavenCentral() }
def libraryDir = providers.gradleProperty('createLibraryDir')
        .getOrElse('/workspace/.cache/create-port/target-libs')
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
    if (providers.gradleProperty('createFlywheelJar').isPresent()) {
        implementation files(providers.gradleProperty('createFlywheelJar').get())
    }
    implementation files("${libraryDir}/ForgeConfigAPIPort-v26.2.1-mc26.2.x-Fabric.jar")
    implementation files(providers.gradleProperty('createMilkJar').getOrElse("${libraryDir}/milk-lib-1.2.1.jar"))
    implementation files("${libraryDir}/core-3.8.4.jar", "${libraryDir}/toml-3.8.4.jar")
    if (providers.gradleProperty('createPonderDir').isPresent()) {
        def ponderDir = providers.gradleProperty('createPonderDir').get()
        implementation files("${ponderDir}/catnip/build/libs/catnip-fabric-1.0.0+mc26.2.createport.1.jar",
                "${ponderDir}/fabric/build/libs/ponder-fabric-1.0.0+mc26.2.createport.1.jar")
    }
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach { enabled = false }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'create_dependency_tests'
        enableGameTests = true
        enableClientGameTests = true
    }
}
tasks.named('runGameTest', JavaExec) {
    systemProperty 'fabric-api.gametest.report-file', layout.buildDirectory.file('test-results/gametest.xml').get().asFile.absolutePath
    doFirst { layout.buildDirectory.dir('test-results').get().asFile.mkdirs() }
}

if (providers.gradleProperty('createPonderDir').isPresent()) {
    sourceSets.named('gametest') { java.srcDir('src/ponderTest/java') }
    def testMetadata = layout.buildDirectory.file('resources/gametest/fabric.mod.json')
    tasks.named('processGametestResources') {
        inputs.property('ponderLibraryTests', true)
        doLast {
            def target = testMetadata.get().asFile
            def metadata = new groovy.json.JsonSlurper().parse(target)
            metadata.entrypoints['fabric-gametest'].add('br.com.mods.createport.PonderDependencyGameTests')
            target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
        }
    }
}
