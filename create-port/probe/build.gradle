// Development probe, deliberately not a mod or an installation package.
// Third-party Create dependencies are missing; failure is expected until ported.
plugins { id 'net.fabricmc.fabric-loom' version '1.18.4' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    def targetLibraries = providers.gradleProperty('createLibraryDir')
            .getOrElse('/workspace/.cache/create-port/target-libs')
    implementation files("${targetLibraries}/ForgeConfigAPIPort-v26.2.1-mc26.2.x-Fabric.jar")
    implementation files("${targetLibraries}/core-3.8.4.jar", "${targetLibraries}/toml-3.8.4.jar")
    implementation files(providers.gradleProperty('createMilkJar')
            .getOrElse("${targetLibraries}/milk-lib-1.2.1.jar"))
    for (property in ['createFlywheelJar', 'createCatnipJar', 'createPonderJar']) {
        if (providers.gradleProperty(property).isPresent()) {
            def library = file(providers.gradleProperty(property).get())
            if (!library.isFile()) throw new GradleException("Missing local library: ${property}")
            implementation files(library)
        }
    }
}
sourceSets.main.resources.srcDirs = []
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none', '-Xmaxerrs', '10000']
}
// A successful source check would still not prove runtime compatibility.
tasks.withType(Jar).configureEach { enabled = false }
