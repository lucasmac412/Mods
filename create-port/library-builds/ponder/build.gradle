plugins { id 'net.fabricmc.fabric-loom' version '1.18.4' apply false }
subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'
    apply plugin: 'java-library'
    version = '1.0.0+mc26.2.createport.1'
    base.archivesName = "${project.name}-fabric"
    repositories { mavenCentral() }
    dependencies {
        minecraft 'com.mojang:minecraft:26.2'
        implementation 'net.fabricmc:fabric-loader:0.19.5'
        implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
        compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
        implementation files('/workspace/.cache/create-port/target-libs/ForgeConfigAPIPort-v26.2.1-mc26.2.x-Fabric.jar',
          '/workspace/.cache/create-port/target-libs/core-3.8.4.jar','/workspace/.cache/create-port/target-libs/toml-3.8.4.jar')
    }
    loom {
        splitEnvironmentSourceSets()
        mods { register(project.name) { sourceSet sourceSets.main; sourceSet sourceSets.client } }
    }
    java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-proc:none','-Xmaxerrs','2000']
    }
    def modVersion = version.toString()
    processResources {
        filesMatching('fabric.mod.json') {
            expand(version:modVersion,minecraft_version:'26.2',fabric_api_version:'0.161.0+26.2',
              fabric_loader_version:'0.19.5',authors_json:'simibubi, Pepper, zelophed',
              contributors_json:'IThundxr, Jozufozu, Snownee, gamez7, tterrag, Grimmauld, TropheusJ')
        }
    }
    jar { from(rootProject.file('LICENSE')) }
}
project(':catnip') {
    sourceSets.main.java.srcDirs = ['common/src/main/java','fabric/src/main/java']
    sourceSets.main.resources.srcDirs = ['common/src/main/resources','fabric/src/main/resources']
    sourceSets.client.java.srcDirs = ['common/src/client/java','fabric/src/client/java']
    sourceSets.client.resources.srcDirs = ['common/src/client/resources','fabric/src/client/resources']
    loom { accessWidenerPath = file('fabric/src/main/resources/catnip.accesswidener') }
}
project(':ponder') {
    sourceSets.main.java.srcDirs = ['../common/src/main/java','src/main/java']
    sourceSets.main.resources.srcDirs = ['../common/src/main/resources','src/main/resources']
    sourceSets.client.java.srcDirs = ['../common/src/client/java','src/client/java']
    sourceSets.client.resources.srcDirs = ['../common/src/client/resources','src/client/resources']
    def catnipClientOutput = rootProject.project(':catnip').sourceSets.client.output
    dependencies {
        api project(':catnip')
        clientImplementation files(catnipClientOutput)
    }
}
